name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    uses: tschk/ci-recipes/.github/workflows/inauguration-ci.yml@master
    with:
      inauguration-path: inauguration
      inauguration-ref: 6e11635a333957b989d2c2a31ca1ebc934905bd2
      install-deps: "nasm qemu-system-x86"
      build-command: |
        mkdir -p /tmp/space-boot
        command nasm -f bin boot/multiboot.asm -o /tmp/space-boot/trampoline.bin
        command in compile --path kernel/kernel-root.in --entry kernel-entry --emit boot \
          --trampoline /tmp/space-boot/trampoline.bin \
          --target native --target-triple x86_64-unknown-none --linkage static-lib \
          --out /tmp/space-boot/kernel.bin
      test-command: |
        echo "Boot image: $(wc -c < /tmp/space-boot/kernel.bin) bytes"
        bash scripts/check-spdp-protocol.sh
        bash scripts/check-sci-contract.sh
        bash scripts/check-architecture-boundaries.sh
        bash scripts/check-kernel-contracts.sh
        bash scripts/check-image-formats.sh
        bash scripts/check-runtime-honesty.sh
        bash scripts/check-sparkfs-init.sh
        bash scripts/check-volume-preservation.sh
        bash scripts/check-process-vfs.sh
        bash scripts/check-personality-abi.sh
        KERNEL_BIN=/tmp/space-boot/kernel.bin bash scripts/check-qemu-smoke.sh
        KERNEL_BIN=/tmp/space-boot/kernel.bin bash scripts/check-qemu-shell.sh

  website:
    name: Website gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
