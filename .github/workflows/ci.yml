name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    uses: tschk/ci-recipes/.github/workflows/inauguration-ci.yml@master
    with:
      inauguration-path: inauguration
      # Inauguration 0.9.239: lexical declaration boundaries used by runtime fixtures.
      inauguration-ref: f5e455ae04ad905f1463160e6e04a4b2d747f5f2
      install-deps: "nasm qemu-system-x86"
      build-command: |
        mkdir -p /tmp/space-boot
        command nasm -f bin boot/multiboot.asm -o /tmp/space-boot/trampoline.bin
        command in compile --path kernel/kernel-root.in --entry kernel-entry --emit boot \
          --trampoline /tmp/space-boot/trampoline.bin \
          --target native --target-triple x86_64-unknown-none --linkage static-lib \
          --out /tmp/space-boot/kernel.bin
      test-command: |
        echo "Boot image: $(wc -c < /tmp/space-boot/kernel.bin) bytes"
        bash scripts/check-spdp-protocol.sh
        bash scripts/check-sci-contract.sh
        bash scripts/check-architecture-boundaries.sh
        bash scripts/check-kernel-contracts.sh
        bash scripts/check-image-formats.sh
        bash scripts/check-runtime-honesty.sh
        bash scripts/check-sparkfs-init.sh
        bash scripts/check-volume-preservation.sh
        bash scripts/check-process-vfs.sh
        bash scripts/check-personality-abi.sh
        python3 scripts/check-boot-data-reservation.py --in "$IN_BIN"
        python3 scripts/check-darwin-pipe-lifetime.py --in "$IN_BIN"
        python3 scripts/check-vfs-shared-offset.py --in "$IN_BIN"
        python3 scripts/check-spdp-page-frames.py --in "$IN_BIN"
        python3 scripts/check-spdp-lifetime.py --in "$IN_BIN"
        python3 scripts/check-sci-resume.py --in "$IN_BIN"
        python3 scripts/check-sci-seat.py --in "$IN_BIN"
        python3 scripts/check-spdp-input.py --in "$IN_BIN" --build-dir /tmp/space-spdp-input-ci
        python3 scripts/check-input-sci.py --in "$IN_BIN" --build-dir /tmp/space-input-sci-ci
        python3 scripts/check-display-allocation.py --in "$IN_BIN"
        python3 scripts/check-channel-capacity.py --in "$IN_BIN"
        python3 scripts/check-posix-wait-status.py --in "$IN_BIN"
        python3 scripts/check-mmap-lifetime.py --in "$IN_BIN"
        python3 scripts/check-windows-wait-result.py --in "$IN_BIN"
        python3 scripts/check-ps2-mouse-init.py --in "$IN_BIN"
        IN="$IN_BIN" bash scripts/check-darwin-personality.sh
        IN="$IN_BIN" bash scripts/check-windows-personality.sh
        IN="$IN_BIN" bash scripts/check-runtime-components.sh
        python3 scripts/check-desktop-launcher.py --in "$IN_BIN" --build-dir /tmp/space-desktop-ci
        KERNEL_BIN=/tmp/space-boot/kernel.bin bash scripts/check-qemu-smoke.sh
        KERNEL_BIN=/tmp/space-boot/kernel.bin bash scripts/check-qemu-shell.sh
        KERNEL_BIN=/tmp/space-boot/kernel.bin bash scripts/check-spdp-composite.sh
        python3 scripts/check-spdp-sci.py --in "$IN_BIN" --build-dir /tmp/space-spdp-sci-ci

  website:
    name: Website gates
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
