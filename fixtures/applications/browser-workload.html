<!doctype html>
<meta charset="utf-8">
<title>Space browser compatibility reference</title>
<style>
  body { background: #111722; color: #e6edf7; font: 20px sans-serif; max-width: 850px; margin: 70px auto; }
  h1 { color: #9ae6cd; }
  textarea { display: block; width: 95%; height: 180px; background: #1c2637; color: white; padding: 16px; font: 18px monospace; }
  button { padding: 12px; margin: 15px 0; }
  canvas { border: 1px solid #567; }
</style>
<h1>Browser application trial</h1>
<p>Host Linux reference — not Space execution</p>
<textarea id="editor" aria-label="Project notes"></textarea>
<button id="save">Save locally</button>
<p id="status">Ready</p>
<canvas id="art" width="400" height="100"></canvas>
<script>
  editor.value = localStorage.getItem('space-reference') || '';
  save.onclick = () => {
    localStorage.setItem('space-reference', editor.value);
    document.querySelector('#status').textContent = 'Saved ' + editor.value.length + ' characters';
  };
  let context = art.getContext('2d');
  context.fillStyle = '#9ae6cd'; context.fillRect(0, 0, 200, 100);
  context.fillStyle = '#7898ff'; context.fillRect(200, 0, 200, 100);
</script>
